# 구조(S0~S4) 노드 → 논리 모델 키 매핑, 그리고 논리 모델 키 → (env 변수, 단가 키, provider) 매핑.
# 모델 문자열·단가는 코드에 하드코딩하지 않는다.
#   - 실제 API 모델 문자열: .env 의 MODEL_* (models[].env 가 가리키는 변수)
#   - 단가: config/pricing.yaml (models[].pricing 키로 참조)
#   - provider: 호출 시 어떤 SDK/LangChain 통합을 쓸지 결정 (google | openai | anthropic)

# 논리 모델 키 정의
models:
  gemini_flash:
    env: MODEL_GEMINI_FLASH       # 기본값 gemini-2.5-flash
    pricing: gemini-2.5-flash
    provider: google
  gemini_pro:
    env: MODEL_GEMINI_PRO         # 기본값 gemini-3.1-pro
    pricing: gemini-3.1-pro
    provider: google
  gpt4o_mini:
    env: MODEL_GPT4O_MINI         # 기본값 gpt-4o-mini
    pricing: gpt-4o-mini
    provider: openai
  claude_haiku:
    env: MODEL_CLAUDE_HAIKU       # 기본값 claude-haiku-4.5
    pricing: claude-haiku-4.5
    provider: anthropic
  o3:
    env: MODEL_O3                 # 기본값 o3
    pricing: o3
    provider: openai
  o4_mini:
    env: MODEL_O4_MINI            # o4-mini (이전 S2 검증 후보)
    pricing: o4-mini
    provider: openai
  claude_sonnet:
    env: MODEL_CLAUDE_SONNET      # claude-sonnet-4-5 (현재 S2 검증 모델 — Anthropic, 대형컨텍스트 OK)
    pricing: claude-sonnet-4-5
    provider: anthropic

# 구조별 노드 역할 → 논리 모델 키
# (구조 간 차이는 그래프 구조에서 발생하며, 모델 배정만 여기서 통제)
structures:
  s0:
    generate: gemini_flash
  s1:
    generate: gemini_pro          # S0과 동일 그래프, generate 모델만 교체
  s2:
    generate: gemini_flash
    verify: gemini_flash          # 논문 3.2.1 통제: 본실험(실험2=s2)은 gemini-2.5-flash 단일 모델
                                  # (이전 예비실험은 claude_sonnet 검증이었음 — 단일모델 통제로 교체)
  s5:
    # 실험 3(동적 신뢰도 캐스케이드). 본실험은 gemini-2.5-flash 단일 모델(논문 3.2.1).
    generate: gemini_flash
    verify: gemini_flash
  s6:
    # 실험 3 개선안(self-probe 신뢰도 캐스케이드). generate/verify 는 s5 와 동일 모델 통제.
    # probe(self_probe 노드)도 동일 모델(gemini_flash)이나 temperature>0 오버라이드로 호출된다.
    generate: gemini_flash
    probe: gemini_flash
    verify: gemini_flash
  s7:
    # 실험 C(반사실 게이트 재현 기반 구조). 생성은 s5 와 동일 프롬프트/모델, 검증은 전수 실행.
    # 모델 통제는 s2/s5 와 동일(gemini-2.5-flash 단일 모델, 논문 3.2.1) — 게이트 정책만 사후 변수.
    generate: gemini_flash
    verify: gemini_flash
  s7_gpt:
    # H6(기반 모델 간 일반화) 검정용. S7 과 그래프/프롬프트 동일, 모델만 gpt-4o-mini.
    generate: gpt4o_mini
    verify: gpt4o_mini
  s7_claude:
    # H6 검정용. S7 과 그래프/프롬프트 동일, 모델만 claude-haiku-4.5.
    generate: claude_haiku
    verify: claude_haiku
  s7_vpro:
    # 실험 D(상위 모델 검증기). 생성은 본실험과 동일(gemini-2.5-flash)로 고정하고
    # 검증기만 상위 모델로 교체하여, 검증기의 판별 능력이 병목인지 분리 검정한다.
    generate: gemini_flash
    verify: claude_sonnet
  s3:
    gen_gemini: gemini_flash      # 다수결 tie 시 우선순위 = Executor(gemini_flash)
    gen_gpt: gpt4o_mini
    gen_claude: claude_haiku
  s4:
    decompose: gemini_flash
    solve: gemini_flash
    aggregate: gemini_flash

# 다수결 tie-break 우선순위 (S3): 세 후보가 모두 다른 군집일 때 채택할 논리 모델 키
s3_tiebreak_priority: gemini_flash
